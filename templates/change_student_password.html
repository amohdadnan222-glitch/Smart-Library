{% extends "base.html" %}

{% block content %}

<div class="container mt-4 change-student-password-page">

    <div class="student-form-wrapper">

        <!-- Header -->
        <div class="student-form-header danger-header">

            <div class="student-form-icon">
                <i class="bi bi-key-fill"></i>
            </div>

            <div>
                <h2>Change Password</h2>

                <p>
                    Update your account password securely
                </p>
            </div>

        </div>


        <!-- Password Form -->
        <div class="student-form-card">

            <form method="POST">

                <div class="student-form-group">

                    <label>
                        <i class="bi bi-lock"></i>
                        Old Password
                    </label>

                    <input
                        type="password"
                        name="old_password"
                        class="form-control"
                        required>

                </div>


                <div class="student-form-group">

                    <label>
                        <i class="bi bi-shield-lock"></i>
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        class="form-control"
                        required>

                </div>


                <div class="student-form-group">

                    <label>
                        <i class="bi bi-shield-check"></i>
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        required>

                </div>


                <button
                    type="submit"
                    class="student-form-submit danger-submit">

                    <i class="bi bi-check-circle"></i>

                    Update Password

                </button>

            </form>


            <a
                href="/student_profile"
                class="student-form-cancel">

                <i class="bi bi-arrow-left"></i>

                Cancel

            </a>

        </div>

    </div>

</div>

{% endblock %}
